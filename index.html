<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Murzik & Dima | Bio</title>
    <style>
        :root {
            --bg-dark: #090a10;
            --card-glass: rgba(18, 20, 32, 0.95);
            --card-border: rgba(168, 85, 247, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glow-purple: #bc6ff1;
            --glow-cyan: #00f0ff;
            --neon-red: #ff3e3e;
            --beat-scale: 1;
            --beat-glow: 0px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(188, 111, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(0, 240, 255, 0.08) 0%, transparent 40%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            overflow-x: hidden;
        }

        .card {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            padding: 28px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 var(--beat-glow) rgba(188, 111, 241, 0.4);
            text-align: center;
            position: relative;
            -webkit-transform: scale(var(--beat-scale));
            transform: scale(var(--beat-scale));
            transition: transform 0.05s linear, box-shadow 0.05s linear;
            will-change: transform, box-shadow;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--glow-purple), var(--glow-cyan), transparent);
        }

        /* Кнопка открытия/закрытия музыки */
        .music-toggle-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, transform 0.15s, background 0.2s;
            z-index: 20;
        }
        .music-toggle-btn:active { transform: scale(0.92); }
        .music-toggle-btn svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            pointer-events: none;
        }

        /* Музыкальный бар */
        .music-bar {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease, margin 0.3s ease, padding 0.3s ease;
            background: rgba(10, 12, 20, 0.85);
            border: 0px solid rgba(255, 255, 255, 0);
            border-radius: 16px;
            margin-bottom: 0;
            padding: 0 12px;
        }
        .music-bar.open {
            max-height: 120px;
            opacity: 1;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid rgba(188, 111, 241, 0.35);
        }
        .player-row {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        
        .track-cover {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            will-change: transform;
        }
        .track-cover svg {
            width: 20px;
            height: 20px;
            fill: var(--glow-cyan);
        }
        .music-bar.playing .track-cover {
            -webkit-animation: spin 6s linear infinite;
            animation: spin 6s linear infinite;
        }
        @-webkit-keyframes spin { 100% { -webkit-transform: rotate(360deg); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .track-info {
            flex: 1;
            min-width: 0;
        }
        .track-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .play-btn {
            background: linear-gradient(135deg, var(--glow-purple), var(--glow-cyan));
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(188, 111, 241, 0.3);
        }
        .play-btn svg {
            width: 14px;
            height: 14px;
            fill: #ffffff;
            pointer-events: none;
        }
        
        .progress-container {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--glow-purple), var(--glow-cyan));
            border-radius: 4px;
        }
        .time-text {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            min-width: 26px;
        }

        /* --- ИСПРАВЛЕННЫЙ КОНТЕЙНЕР АВАРАРКИ ДЛЯ ВСЕХ БРАУЗЕРОВ --- */
        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #visualizer-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 120px;
            height: 120px;
            pointer-events: none;
            z-index: 1;
        }

        .pulse-ring {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 2px solid var(--glow-purple);
            opacity: 0;
            pointer-events: none;
            box-sizing: border-box;
        }
        .playing .pulse-ring {
            -webkit-animation: ringPulse 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            animation: ringPulse 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @-webkit-keyframes ringPulse {
            0% { -webkit-transform: scale(0.95); opacity: 0.8; }
            100% { -webkit-transform: scale(1.45); opacity: 0; }
        }
        @keyframes ringPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.45); opacity: 0; }
        }

        .avatar-wrapper {
            position: relative;
            z-index: 2;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--glow-purple), var(--glow-cyan));
            box-shadow: 0 0 15px rgba(188, 111, 241, 0.4);
            -webkit-animation: floatAvatar 4s ease-in-out infinite;
            animation: floatAvatar 4s ease-in-out infinite;
            will-change: transform, box-shadow;
        }
        @-webkit-keyframes floatAvatar {
            0%, 100% { -webkit-transform: translateY(0) scale(1); box-shadow: 0 0 15px rgba(188, 111, 241, 0.4); }
            50% { -webkit-transform: translateY(-4px) scale(1.02); box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); }
        }
        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 0 15px rgba(188, 111, 241, 0.4); }
            50% { transform: translateY(-4px) scale(1.02); box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #111;
            display: block;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            background: rgba(255, 62, 62, 0.12);
            border: 1px solid rgba(255, 62, 62, 0.25);
            color: var(--neon-red);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 14px;
            border-radius: 100px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-red);
            border-radius: 50%;
        }
        .stats-container {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }
        .stats-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 4px;
            border-radius: 14px;
        }
        .stats-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .stats-value {
            font-size: 13px;
            font-weight: 800;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 13px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 10px;
            color: #ffffff;
            transition: transform 0.1s ease;
        }
        .btn-action:active { transform: scale(0.97); }
        .btn-da { background: linear-gradient(135deg, #ff6b00, #ff8800); }
        .btn-boost { background: linear-gradient(135deg, #00c853, #00b0ff); }

        .row-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;

        }
        .row-link:active { background: rgba(255, 255, 255, 0.06); }
        .row-arrow { color: #3b82f6; font-size: 12px; font-weight: 600; }

        .panel-iris {
            margin-top: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            border: 1px solid rgba(188, 111, 241, 0.2);
            text-align: left;
        }
        .iris-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .iris-title {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 800;
            text-transform: uppercase;
        }
        .iris-link {
            font-size: 10px;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
        }
        code {
            font-family: monospace;
            color: #d8b4fe;
            font-size: 12px;
            display: block;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(188, 111, 241, 0.1);
            font-weight: 700;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <script>
        const audio = document.getElementById('bg-audio');
        const musicBar = document.getElementById('music-bar');
        const mainPlayBtn = document.getElementById('main-play-btn');
        const playIcon = document.getElementById('play-icon');
        const progressFill = document.getElementById('progress-fill');
        const timeCurr = document.getElementById('time-curr');
        const timeDur = document.getElementById('time-dur');
        const avatarContainer = document.getElementById('avatar-container');
        const canvas = document.getElementById('visualizer-canvas');
        const ctx = canvas.getContext('2d');

        const SVG_PLAY = '<path d="M8 5v14l11-7z"/>';
        const SVG_PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        let audioCtx, analyser, dataArray;
        let isAudioSetup = false;

        function initAudioContext() {
            if (isAudioSetup) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                const source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isAudioSetup = true;
                drawVisualizer();
            } catch (e) {
                // Если заблокирован CORS или браузер запрещает доступ
            }
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!analyser || audio.paused) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                document.documentElement.style.setProperty('--beat-scale', '1');
                document.documentElement.style.setProperty('--beat-glow', '0px');
                return;
            }

            analyser.getByteFrequencyData(dataArray);

            let bassSum = 0;
            for (let i = 0; i < 6; i++) {
                bassSum += dataArray[i];
            }
            let bassAvg = bassSum / 6;

            let scaleVal = 1 + (bassAvg / 255) * 0.035;
            let glowVal = (bassAvg / 255) * 20;
            document.documentElement.style.setProperty('--beat-scale', scaleVal.toFixed(3));
            document.documentElement.style.setProperty('--beat-glow', glowVal.toFixed(1) + 'px');

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 50;
            const bars = 28;

            for (let i = 0; i < bars; i++) {
                let value = dataArray[i % dataArray.length] || 0;
                let barHeight = (value / 255) * 12;

                let angle = (i * 360 / bars) * Math.PI / 180;
                let x1 = centerX + Math.cos(angle) * radius;
                let y1 = centerY + Math.sin(angle) * radius;
                let x2 = centerX + Math.cos(angle) * (radius + barHeight);
                let y2 = centerY + Math.sin(angle) * (radius + barHeight);

                ctx.strokeStyle = i % 2 === 0 ? '#bc6ff1' : '#00f0ff';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
        }

        /* Переключение видимости музыкальной панели */
        function togglePlayerPanel(e) {
            if(e) e.stopPropagation();
            musicBar.classList.toggle('open');
        }

        function manualPlay(e) {
            if(e) e.stopPropagation();
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (audio.paused) {
                audio.play().catch(() => {});
            } else {
                audio.pause();
            }
        }

        document.addEventListener('click', (e) => {
            // Если кликнули на кнопки — автовопроизведение не перехватывает
            if (e.target.closest('.music-toggle-btn') || e.target.closest('.play-btn') || e.target.closest('.progress-bar')) return;
            
            if (audio.paused) {
                initAudioContext();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                audio.play().catch(() => {});
            }
        }, { once: true });

        audio.addEventListener('play', () => {
            playIcon.innerHTML = SVG_PAUSE;
            musicBar.classList.add('playing');
            avatarContainer.classList.add('playing');
        });

        audio.addEventListener('pause', () => {
            playIcon.innerHTML = SVG_PLAY;
            musicBar.classList.remove('playing');
            avatarContainer.classList.remove('playing');
        });

        audio.addEventListener('loadedmetadata', () => {
            timeDur.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = pct + '%';
                timeCurr.innerText = formatTime(audio.currentTime);
                timeDur.innerText = formatTime(audio.duration);
            }
        });

        function seek(e) {
            if(e) e.stopPropagation();
            const bar = document.getElementById('progress-bar');
            const rect = bar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const pct = clickX / rect.width;
            if (audio.duration) {
                audio.currentTime = pct * audio.duration;
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
