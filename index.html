<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Murzik & Dima | Bio</title>
    <style>
        :root {
            --bg: #0b0c10;
            --card: #161823;
            --border: rgba(168, 85, 247, 0.25);
            --text: #f8fafc;
            --muted: #94a3b8;
            --purple: #bc6ff1;
            --cyan: #00f0ff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            text-align: center;
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--purple), var(--cyan), var(--purple));
            border-radius: 24px 24px 0 0;
        }
        .avatar {
            width: 86px;
            height: 86px;
            background: linear-gradient(135deg, #8b5cf6, #d946ef);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 0 20px rgba(217,70,239,0.3);
        }
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
        .status {
            display: inline-block;
            margin-bottom: 24px;
            background: rgba(255,56,56,0.1);
            border: 1px solid rgba(255,56,56,0.25);
            color: #ff3838;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 14px;
            border-radius: 100px;
        }
        .grid {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 24px;
        }
        .box {
            flex: 1;
            background: rgba(255,255,255,0.03);
            padding: 10px 4px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
        .val { font-size: 14px; font-weight: 800; }
        .btn {
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; padding: 14px; border-radius: 14px;
            font-weight: 700; font-size: 14px; margin-bottom: 12px;
            color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .btn-d { background: linear-gradient(135deg, #ff7b00, #ffae00); box-shadow: 0 4px 15px rgba(255,123,0,0.2); }
        .btn-b { background: linear-gradient(135deg, #00e676, #00b0ff); box-shadow: 0 4px 15px rgba(0,230,118,0.15); }
        .link {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
            color: #e2e8f0; text-decoration: none; padding: 14px 16px;
            border-radius: 14px; font-size: 14px; font-weight: 600; margin-bottom: 12px;
        }
        .act { color: var(--cyan); font-size: 12px; font-weight: 700; }
        .iris {
            margin-top: 20px; padding: 14px; background: rgba(0,0,0,0.2);
            border-radius: 16px; border: 1px solid rgba(188,111,241,0.15); text-align: left;
        }
        .iris-hd { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
        .iris-btn { color: var(--purple); text-decoration: none; }
        code {
            font-family: monospace; color: #e0aaff; font-size: 13px; display: block;
            background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; border: 1px solid rgba(188,111,241,0.1); font-weight: bold;
        }
        .foot { display: flex; justify-content: center; gap: 16px; margin-top: 20px; font-size: 13px; font-weight: 600; }
        .foot a { color: var(--muted); text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">🐱‍👤</div>
        <h1>Murzik : Dima</h1>
        <div class="status">НЕ ИЩУ ОБЩЕНИЯ!!</div>

        <div class="grid">
            <div class="box"><div class="lbl">Возраст</div><div class="val" style="color:var(--purple);">Секрет</div></div>
            <div class="box"><div class="lbl">Рост</div><div class="val">178 см</div></div>
            <div class="box"><div class="lbl">Бд</div><div class="val">22 Мая</div></div>
        </div>

        <a href="https://donationalerts.com__" target="_blank" class="btn btn-d">💎 Поддержать на DonationAlerts</a>
        <a href="https://t.me" target="_blank" class="btn btn-b">🚀 Бустануть наш канал</a>
        
        <a href="https://t.me" target="_blank" class="link">
            <span>👑 Лс: @Murrzilkaa</span><span class="act">Перейти →</span>
        </a>
        
        <a href="http://t.me" target="_blank" class="link">
            <span>💬 Анонимные вопросы</span><span class="act">Написать →</span>
        </a>

        <div class="iris">
            <div class="iris-hd"><span>В ЛС ИРИСА</span><a href="https://t.me" target="_blank" class="iris-btn">ОТПРАВИТЬ →</a></div>
            <code>+саб @7127295961</code>
        </div>
    </div>

    <div class="foot">
        <a href="http://t.me" target="_blank">Анон</a>
        <span style="color:rgba(255,255,255,0.1)">•</span>
        <a href="https://t.me" target="_blank">Лс</a>
        <span style="color:rgba(255,255,255,0.1)">•</span>
        <a href="https://teletype.in" target="_blank">Подробнее</a>
    </div>

</body>
</html>
