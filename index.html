<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murzik & Dima | Bio</title>
    <style>
        :root {
            --bg: #0b0c10;
            --card: rgba(20, 22, 33, 0.85);
            --border: rgba(168, 85, 247, 0.25);
            --text: #f8fafc;
            --muted: #94a3b8;
            --purple: #bc6ff1;
            --orange: #ff7b00;
            --green: #00e676;
            --cyan: #00f0ff;
            --red: #ff3838;
        }
        body {
            background: var(--bg) radial-gradient(at 0% 0%, rgba(188,111,241,0.15) 0px, transparent 50%) radial-gradient(at 100% 100%, rgba(0,240,255,0.1) 0px, transparent 50%);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            box-sizing: border-box;
            margin: 0;
        }
        .card {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            padding: 35px 22px;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(168,85,247,0.1), 0 20px 50px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--purple), var(--cyan), var(--purple));
            border-radius: 28px 28px 0 0;
        }
        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #8b5cf6, #d946ef);
            border-radius: 50%;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 25px rgba(217,70,239,0.35);
        }
        h1 { margin: 0 0 8px 0; font-size: 26px; font-weight: 800; }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 28px;
            background: rgba(255,56,56,0.1);
            border: 1px solid rgba(255,56,56,0.25);
            color: var(--red);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 16px;
            border-radius: 100px;
        }
        .dot { width: 6px; height: 6px; background: var(--red); border-radius: 50%; }
        .grid { display: flex; gap: 10px; margin-bottom: 28px; }
        .box { flex: 1; background: rgba(255,255,255,0.03); padding: 12px 4px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
        .val { font-size: 15px; font-weight: 800; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-decoration: none; padding: 15px; border-radius: 16px;
            font-weight: 700; font-size: 15px; margin-bottom: 12px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.02); }
        .btn-d { background: linear-gradient(135deg, #ff7b00, #ffae00); color: #fff; box-shadow: 0 4px 20px rgba(255,123,0,0.25); }
        .btn-b { background: linear-gradient(135deg, #00e676, #00b0ff); color: #fff; box-shadow: 0 4px 20px rgba(0,230,118,0.2); }
        .link {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
            color: #e2e8f0; text-decoration: none; padding: 15px 20px;
            border-radius: 16px; font-size: 14px; font-weight: 600; margin-bottom: 12px;
        }
        .link:hover { border-color: rgba(0,240,255,0.3); }
        .act { color: var(--cyan); font-size: 12px; font-weight: 700; }
        .iris {
            margin-top: 24px; padding: 16px; background: rgba(0,0,0,0.3);
            border-radius: 18px; border: 1px solid rgba(188,111,241,0.15); text-align: left;
        }
        .iris-hd { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
        .iris-btn { color: var(--purple); text-decoration: none; }
        code {
            font-family: monospace; color: #e0aaff; font-size: 13px; display: block;
            background: rgba(15,12,26,0.7); padding: 10px; border-radius: 8px; border: 1px solid rgba(188,111,241,0.1); font-weight: bold;
        }
        .foot { display: flex; justify-content: center; gap: 16px; margin-top: 24px; font-size: 13px; font-weight: 600; }
        .foot a { color: var(--muted); text-decoration: none; }
        .foot a:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">🐱‍👤</div>
        <h1>Murzik : Dima</h1>
        <div class="status"><span class="dot"></span>НЕ ИЩУ ОБЩЕНИЯ!!</div>

        <div class="grid">
            <div class="box"><div class="lbl">Возраст</div><div class="val" style="color:var(--purple);">Секрет</div></div>
            <div class="box"><div class="lbl">Рост</div><div class="val">178 см</div></div>
            <div class="box"><div class="lbl">Бд</div><div class="val">22 Мая</div></div>
        </div>

        <a href="https://donationalerts.com__" target="_blank" class="btn btn-d">💎 Поддержать на DonationAlerts</a>
        <a href="https://t.me" target="_blank" class="btn btn-b">🚀 Бустануть наш канал</a>
        
        <a href="https://t.me" target="_blank" class="link">
            <span>👑 Лс: @Murrzilkaa</span><span class="act">Перейти →</span>
        </a>
        
        <a href="http://t.me" target="_blank" class="link">
            <span>💬 Анонимные вопросы</span><span class="act">Написать →</span>
        </a>

        <div class="iris">
            <div class="iris-hd"><span>Команда для ЛС Ириса</span><a href="https://t.me" target="_blank" class="iris-btn">Отправить →</a></div>
            <code>+саб @7127295961</code>
        </div>
    </div>

    <div class="foot">
        <a href="http://t.me" target="_blank">Анон</a><span>•</span>
        <a href="https://t.me" target="_blank">Лс</a><span>•</span>
        <a href="https://teletype.in" target="_blank">Подробнее</a>
    </div>

</body>
</html>
