<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Murzik & Dima | Premium Bio</title>
    <style>
        :root {
            --bg-dark: #07080e;
            --card-glass: rgba(18, 20, 32, 0.75);
            --card-border: rgba(168, 85, 247, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glow-purple: #bc6ff1;
            --glow-cyan: #00f0ff;
            --neon-red: #ff3e3e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(188, 111, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 240, 255, 0.1) 0px, transparent 50%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .card {
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            width: 100%;
            max-width: 380px;
            padding: 36px 22px;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.65), 0 0 35px rgba(188, 111, 241, 0.08);
            text-align: center;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--glow-purple), var(--glow-cyan), transparent);
        }

        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--glow-purple), var(--glow-cyan));
            box-shadow: 0 0 25px rgba(188, 111, 241, 0.4);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #111;
            display: block;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(188, 111, 241, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 35px rgba(0, 240, 255, 0.6); }
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 26px;
            background: rgba(255, 62, 62, 0.12);
            border: 1px solid rgba(255, 62, 62, 0.25);
            color: var(--neon-red);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 16px;
            border-radius: 100px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-red);
        }

        .stats-container {
            display: flex;
            gap: 8px;
            margin-bottom: 26px;
        }

        .stats-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 4px;
            border-radius: 16px;
        }

        .stats-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .stats-value {
            font-size: 14px;
            font-weight: 800;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 15px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 12px;
            color: #ffffff;
            transition: transform 0.2s ease, box-shadow 0.2s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-da {
            background: linear-gradient(135deg, #ff6b00, #ff8800);
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.25);
        }

        .btn-boost {
            background: linear-gradient(135deg, #00c853, #00b0ff);
            box-shadow: 0 5px 15px rgba(0, 200, 83, 0.25);
        }

        .row-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .row-link:hover, .row-link:active {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.3);
        }

        .row-arrow {
            color: var(--glow-cyan);
            font-size: 15px;
            font-weight: 700;
        }

        .panel-iris {
            margin-top: 22px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 18px;
            border: 1px solid rgba(188, 111, 241, 0.15);
            text-align: left;
        }

        .iris-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .iris-title {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .iris-link {
            font-size: 11px;
            color: var(--glow-purple);
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            color: #d8b4fe;
            font-size: 13px;
            display: block;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(188, 111, 241, 0.08);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-wrapper">
            <img class="avatar-img" src="avatar.png" onerror="this.src='https://unsplash.com'" alt="Avatar">
        </div>
        
        <h1>Murzik : Dima</h1>
        
        <div class="status-pill">
            <span class="status-dot"></span>
            НЕ ИЩУ ОБЩЕНИЯ!!
        </div>

        <div class="stats-container">
            <div class="stats-box">
                <div class="stats-label">Возраст</div>
                <div class="stats-value" style="color: var(--glow-purple);">Секрет</div>
            </div>
            <div class="stats-box">
                <div class="stats-label">Рост</div>
                <div class="stats-value">178 см</div>
            </div>
            <div class="stats-box">
                <div class="stats-label">Бд</div>
                <div class="stats-value">22 Мая</div>
            </div>
        </div>

        <!-- Кнопки донатов и бустов -->
        <a href="https://donationalerts.com__" target="_blank" class="btn-action btn-da">
            <span>💎 Поддержать на DonationAlerts</span>
        </a>
        
        <a href="https://t.me" target="_blank" class="btn-action btn-boost">
            <span>🚀 Бустануть наш канал</span>
        </a>
        
        <!-- Полный список ссылок внутри карточки -->
        <a href="http://t.me" target="_blank" class="row-link">
            <span>💬 Анон / Анонимные вопросы</span>
            <span class="row-arrow">→</span>
        </a>

        <a href="https://t.me" target="_blank" class="row-link">
            <span>👑 Лс: @Murrzilkaa</span>
            <span class="row-arrow">→</span>
        </a>

        <a href="https://teletype.in" target="_blank" class="row-link">
            <span>📖 Подробнее / Teletype</span>
            <span class="row-arrow">→</span>
        </a>

        <!-- Блок Ириса -->
        <div class="panel-iris">
            <div class="iris-top">
                <span class="iris-title">В ЛС ИРИСА</span>
                <a href="https://t.me" target="_blank" class="iris-link">ОТПРАВИТЬ</a>
            </div>
            <code>+саб @7127295961</code>
        </div>
    </div>

</body>
</html>
