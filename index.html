<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Murzik & Dima | Bio</title>
    <style>
        :root {
            --bg-dark: #07080e;
            --card-glass: rgba(18, 20, 32, 0.75);
            --card-border: rgba(168, 85, 247, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glow-purple: #bc6ff1;
            --glow-cyan: #00f0ff;
            --neon-red: #ff3e3e;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(188, 111, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 240, 255, 0.1) 0px, transparent 50%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            width: 100%;
            max-width: 380px;
            padding: 36px 22px;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.65), 0 0 35px rgba(188, 111, 241, 0.08);
            text-align: center;
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--glow-purple), var(--glow-cyan), transparent);
        }

        /* Кнопка открытия плеера */
        .music-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .music-toggle-btn:hover {
            border-color: var(--glow-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transform: scale(1.05);
        }

        /* Выезжающий плавающий плеер */
        .music-bar {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(10, 12, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin-bottom: 20px;
            padding: 0 14px;
        }
        .music-bar.open {
            max-height: 120px;
            opacity: 1;
            padding: 12px 14px;
            border-color: rgba(188, 111, 241, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .player-row {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        .track-cover {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--glow-purple), var(--glow-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            animation: spin 8s linear infinite;
            animation-play-state: paused;
        }
        .music-bar.playing .track-cover {
            animation-play-state: running;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .track-info {
            flex: 1;
            min-width: 0;
        }
        .track-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .play-btn {
            background: linear-gradient(135deg, var(--glow-purple), var(--glow-cyan));
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }
        .play-btn:active { transform: scale(0.9); }
        
        .progress-container {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--glow-purple), var(--glow-cyan));
            border-radius: 4px;
            transition: width 0.1s linear;
        }
        .time-text {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            min-width: 28px;
        }

        /* Аватарка */
        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--glow-purple), var(--glow-cyan));
            box-shadow: 0 0 25px rgba(188, 111, 241, 0.4);
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #111;
            display: block;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(188, 111, 241, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 35px rgba(0, 240, 255, 0.6); }
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 26px;
            background: rgba(255, 62, 62, 0.12);
            border: 1px solid rgba(255, 62, 62, 0.25);
            color: var(--neon-red);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 16px;
            border-radius: 100px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-red);
        }
        .stats-container {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
        }
        .stats-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 4px;
            border-radius: 16px;
        }
        .stats-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .stats-value {
            font-size: 14px;
            font-weight: 800;
        }

        /* Главные кнопки */
        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 15px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 12px;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .btn-action:active { transform: scale(0.98); }
        .btn-da {
            background: linear-gradient(135deg, #ff6b00, #ff8800);
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.25);
        }
        .btn-da:hover { box-shadow: 0 8px 20px rgba(255, 107, 0, 0.4); }
        .btn-boost {
            background: linear-gradient(135deg, #00c853, #00b0ff);
            box-shadow: 0 5px 15px rgba(0, 200, 83, 0.25);
        }
        .btn-boost:hover { box-shadow: 0 8px 20px rgba(0, 200, 83, 0.4); }

        /* Ссылки списком */
        .row-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }
        .row-link:hover, .row-link:active {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.3);
            transform: translateY(-1px);
        }
        .row-arrow {
            color: #3b82f6;
            font-size: 13px;
            font-weight: 600;
        }

        /* Блок Ириса */
        .panel-iris {
            margin-top: 12px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 18px;
            border: 1px solid rgba(188, 111, 241, 0.2);
            text-align: left;
        }
        .iris-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .iris-title {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .iris-link {
            font-size: 11px;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }
        .iris-link:hover { color: var(--glow-cyan); }
        code {
            font-family: 'Courier New', Courier, monospace;
            color: #d8b4fe;
            font-size: 13px;
            display: block;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(188, 111, 241, 0.1);
            font-weight: 700;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <!-- Встроена прямая аудиодорожка песни onokami - Грустинка -->
    <audio id="bg-audio" loop src="https://cdns-preview-3.dzcdn.net/stream/c-347b85f2695c024d2bdbe7e4b9f29107-2.mp3"></audio>

    <div class="card">
        <!-- Кнопка открытия бара музыки -->
        <button class="music-toggle-btn" id="toggle-btn" onclick="togglePlayerPanel()" title="Музыка">🎵</button>

        <div class="avatar-wrapper">
            <img class="avatar-img" src="avatar.png" onerror="this.src='https://picsum.photos/200'" alt="Avatar">
        </div>

        <!-- Открывающийся бар музыки -->
        <div class="music-bar" id="music-bar">
            <div class="player-row">
                <div class="track-cover">💿</div>
                <div class="track-info">
                    <div class="track-title">Грустинка</div>
                    <div class="track-artist">onokami</div>
                </div>
                <button class="play-btn" id="main-play-btn" onclick="togglePlay()">▶</button>
            </div>
            <div class="progress-container">
                <span class="time-text" id="time-curr">0:00</span>
                <div class="progress-bar" id="progress-bar" onclick="seek(event)">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="time-text" id="time-dur">0:00</span>
            </div>
        </div>
        
        <h1>Murzik : Dima</h1>
        
        <div class="status-pill">
            <span class="status-dot"></span>
            НЕ ИЩУ ОБЩЕНИЯ!!
        </div>

        <!-- Статистика -->
        <div class="stats-container">
            <div class="stats-box">
                <div class="stats-label">Возраст</div>
                <div class="stats-value" style="color: var(--glow-purple);">Секрет</div>
            </div>
            <div class="stats-box">
                <div class="stats-label">Рост</div>
                <div class="stats-value">≈178 см</div>
            </div>
            <div class="stats-box">
                <div class="stats-label">Бд</div>
                <div class="stats-value">22 Мая</div>
            </div>
        </div>

        <!-- Кнопки действия -->
        <a href="https://www.donationalerts.com/r/kairos__" onclick="startMusic()" target="_blank" class="btn-action btn-da">
            <span>💸 DonationAlerts</span>
        </a>
        
        <a href="https://t.me/boost?c=3050717296" onclick="startMusic()" target="_blank" class="btn-action btn-boost">
            <span>⚡ Boost Channel</span>
        </a>
        
        <!-- Ссылки списком -->
        <a href="https://t.me/Murrzilkaa" onclick="startMusic()" target="_blank" class="row-link">
            <span>Лс: @Murrzilkaa</span>
            <span class="row-arrow">Написать ↗</span>
        </a>

        <a href="https://teletype.in/@wass_912/C3rsWiC8Qxa" onclick="startMusic()" target="_blank" class="row-link">
            <span>📖 Подробнее / Teletype</span>
            <span class="row-arrow">Открыть ↗</span>
        </a>

        <a href="http://t.me/anonaskbot?start=pi3py" onclick="startMusic()" target="_blank" class="row-link">
            <span>💬 Анонимные сообщения</span>
            <span class="row-arrow">Открыть ↗</span>
        </a>

        <!-- Блок Ириса -->
        <div class="panel-iris">
            <div class="iris-top">
                <span class="iris-title">В ЛС ИРИСА</span>
                <a href="https://t.me/iris_black_bot/1?text=%2B%D1%81%D0%B0%D0%B1%20%407127295961" target="_blank" class="iris-link">Отправить команду ↗</a>
            </div>
            <code>+саб @7127295961</code>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bg-audio');
        const musicBar = document.getElementById('music-bar');
        const mainPlayBtn = document.getElementById('main-play-btn');
        const progressFill = document.getElementById('progress-fill');
        const timeCurr = document.getElementById('time-curr');
        const timeDur = document.getElementById('time-dur');

        function togglePlayerPanel() {
            musicBar.classList.toggle('open');
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function startMusic() {
            if (audio.paused) {
                audio.play();
            }
        }

        audio.addEventListener('play', () => {
            mainPlayBtn.innerText = "⏸";
            musicBar.classList.add('playing');
        });

        audio.addEventListener('pause', () => {
            mainPlayBtn.innerText = "▶";
            musicBar.classList.remove('playing');
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = pct + '%';
                timeCurr.innerText = formatTime(audio.currentTime);
                timeDur.innerText = formatTime(audio.duration);
            }
        });

        function seek(e) {
            const bar = document.getElementById('progress-bar');
            const rect = bar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const pct = clickX / rect.width;
            audio.currentTime = pct * audio.duration;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
