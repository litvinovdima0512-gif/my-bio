<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Murzik & Dima | Premium Bio</title>
    <style>
        :root {
            --bg-dark: #06070d;
            --card-glass: rgba(18, 20, 32, 0.7);
            --card-border: rgba(168, 85, 247, 0.2);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glow-purple: #bc6ff1;
            --glow-cyan: #00f0ff;
            --neon-red: #ff3e3e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(188, 111, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 240, 255, 0.08) 0px, transparent 50%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .card {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            width: 100%;
            max-width: 390px;
            padding: 36px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(188, 111, 241, 0.05);
            text-align: center;
            position: relative;
        }

        /* Тонкий светящийся индикатор сверху */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--glow-purple), var(--glow-cyan), transparent);
        }

        .avatar-glow {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #7c3aed, #c084fc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(188, 111, 241, 0.35);
        }

        .avatar-img {
            font-size: 42px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 28px;
            background: rgba(255, 62, 62, 0.1);
            border: 1px solid rgba(255, 62, 62, 0.2);
            color: var(--neon-red);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 14px;
            border-radius: 100px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-red);
        }

        .stats-container {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        .stats-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 6px;
            border-radius: 16px;
        }

        .stats-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .stats-value {
            font-size: 15px;
            font-weight: 800;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 12px;
            color: #ffffff;
            transition: transform 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-da {
            background: linear-gradient(135deg, #ff6b00, #ff8800);
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.25);
        }

        .btn-boost {
            background: linear-gradient(135deg, #00c853, #00b0ff);
            box-shadow: 0 6px 20px rgba(0, 200, 83, 0.2);
        }

        .row-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            text-decoration: none;
            padding: 15px 18px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            transition: background 0.2s, border-color 0.2s;
        }

        .row-link:hover, .row-link:active {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(0, 240, 255, 0.25);
        }

        .row-arrow {
            color: var(--glow-cyan);
            font-size: 16px;
            font-weight: 700;
        }

        .panel-iris {
            margin-top: 24px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 18px;
            border: 1px solid rgba(188, 111, 241, 0.15);
            text-align: left;
        }

        .iris-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .iris-title {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .iris-link {
            font-size: 12px;
            color: var(--glow-purple);
            text-decoration: none;
            font-weight: 700;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            color: #d8b4fe;
            font-size: 13px;
            display: block;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(188, 111, 241, 0.08);
            font-weight: 700;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            font-size: 13px;
            font-weight: 600;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer-links span {
            color: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>
