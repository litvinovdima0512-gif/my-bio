<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murzik & Dima | Bio</title>
    <style>
        :root {
            --bg-color: #090a0f;
            --card-bg: rgba(22, 25, 35, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --accent-purple: #a855f7;
            --accent-orange: #ff7f24;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            box-sizing: border-box;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            width: 100%;
            max-width: 440px;
            padding: 36px 24px;
            box-sizing: border-box;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, var(--accent-purple), #3b82f6);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-block;
            margin: 0 auto 28px auto;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: var(--accent-red);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 16px;
            border-radius: 100px;
        }

        .info-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        .info-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            padding: 14px 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            padding: 15px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-donate {
            background: var(--accent-orange);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(255, 127, 36, 0.2);
        }

        .btn-boost {
            background: var(--accent-green);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.2);
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 10px 0;
        }

        .contact-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s;
        }

        .contact-link:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .contact-action {
            color: #3b82f6;
            font-size: 13px;
            font-weight: 600;
        }

        .iris-section {
            margin-top: 24px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: left;
        }

        .iris-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .iris-title {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .iris-btn {
            font-size: 12px;
            color: var(--accent-purple);
            text-decoration: none;
            font-weight: 600;
        }

        .iris-btn:hover {
            text-decoration: underline;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            color: #c084fc;
            font-size: 13px;
            word-break: break-all;
            display: block;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            user-select: all;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            font-size: 14px;
            font-weight: 500;
        }

        .footer-nav a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-nav a:hover {
            color: var(--text-main);
        }

        .footer-nav span {
            color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
