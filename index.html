<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murzik & Dima | Official Bio</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(20, 22, 33, 0.75);
            --card-border: rgba(168, 85, 247, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-purple: #bc6ff1;
            --neon-orange: #ff7b00;
            --neon-green: #00e676;
            --neon-cyan: #00f0ff;
            --neon-red: #ff3838;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(188, 111, 241, 0.18) 0px, transparent 45%),
                radial-gradient(at 90% 90%, rgba(0, 240, 255, 0.12) 0px, transparent 45%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            box-sizing: border-box;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            width: 100%;
            max-width: 430px;
            padding: 40px 26px;
            box-sizing: border-box;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.15), 0 30px 70px rgba(0, 0, 0, 0.9);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Декоративная неоновая линия сверху */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan), var(--neon-purple));
            background-size: 200% auto;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 22px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8b5cf6, #d946ef);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            box-shadow: 0 0 30px rgba(217, 70, 239, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0 auto 32px auto;
            background: rgba(255, 56, 56, 0.12);
            border: 1px solid rgba(255, 56, 56, 0.3);
            color: var(--neon-red);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 7px 18px;
            border-radius: 100px;
            box-shadow: 0 0 15px rgba(255, 56, 56, 0.15);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .info-grid {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        .info-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            padding: 14px 6px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border-color 0.3s, background 0.3s;
        }

        .info-box:hover {
            border-color: rgba(0, 240, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
        }

        .info-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        .info-value {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            padding: 16px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 16px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .btn-donate {
            background: linear-gradient(135deg, #ff7b00, #ffae00);
            color: #ffffff;
            box-shadow: 0 6px 24px rgba(255, 123, 0, 0.3);
        }

        .btn-boost {
            background: linear-gradient(135deg, #00e676, #00b0ff);
            color: #ffffff;
            box-shadow: 0 6px 24px rgba(0, 230, 118, 0.25);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            margin: 12px 0;
        }

        .contact-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #e2e8f0;
            text-decoration: none;
            padding: 16px 22px;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .contact-link:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .contact-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contact-action {
            color: var(--neon-cyan);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .iris-section {
            margin-top: 28px;
            padding: 18px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            border: 1px solid rgba(188, 111, 241, 0.15);
            text-align: left;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .iris-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .iris-title {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .iris-btn {
            font-size: 12px;
            color: var(--neon-purple);
            text-decoration: none;
            font-weight: 700;
            background: rgba(188, 111, 241, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(188, 111, 241, 0.2);
            transition: all 0.2s;
        }

        .iris-btn:hover {
            background: var(--neon-purple);
            color: #000000;
            box-shadow: 0 0 10px rgba(188, 111, 241, 0.4);
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            color: #e0aaff;
            font-size: 14px;
            word-break: break-all;
            display: block;
            background: rgba(15, 12, 26, 0.8);
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(188, 111, 241, 0.1);
            user-select: all;
            font-weight: bold;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 28px;
            font-size: 14px;
            font-weight: 600;
        }

        .footer-nav a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .footer-nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .footer-nav span {
            color: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <div class="avatar">🐱‍👤</div>
        </div>
        <h1>Murzik : Dima</h1>
        <div class="status-badge">
            <span class="status-dot"></span>
            НЕ ИЩУ ОБЩЕНИЯ!!
        </div>

        <div class="info-grid">
            <div class="info-box">
